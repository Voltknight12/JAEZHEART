<title>Corazón de Te amo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;height:100dvh;margin:0;background:#000;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Segoe UI","Noto Sans","Noto Sans CJK SC","Malgun Gothic","Yu Gothic",Arial,sans-serif}
button{font-family:inherit;-webkit-appearance:none;appearance:none}
#heart{visibility:hidden;position:relative;width:min(98vw,94vh);height:min(98vw,94vh);width:min(98vw,92dvh);height:min(98vw,92dvh)}
.w{position:absolute;white-space:nowrap;opacity:0;transform:translateY(-70px);line-height:1;font-weight:600;will-change:transform,opacity;transition:opacity .7s ease-out,transform 1.3s cubic-bezier(.25,1.35,.5,1),color .15s,text-shadow .15s}
.w.on{opacity:1;transform:none}
.w.glow{color:#fff!important;text-shadow:0 0 6px #fff,0 0 14px #fff,0 0 26px #fff,0 0 42px rgba(255,255,255,.8);z-index:2;transform:scale(1.12)}
#intro{position:fixed;inset:0;z-index:5;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
#intro.gone{opacity:0;pointer-events:none}
.ph{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,8vw,64px);color:#ff4d4d;text-shadow:0 0 18px rgba(255,60,60,.6);opacity:0;transition:opacity .8s ease}
.ph.in{opacity:1}
#tap{position:absolute;bottom:18%;margin:0;font-size:15px;letter-spacing:.06em;color:rgba(255,255,255,.55);display:none}
#restart{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:6;padding:8px 16px;font-size:15px;color:#ff5a5a;background:rgba(0,0,0,.6);border:1.5px solid #ff5a5a;border-radius:24px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,background .2s,color .2s}
#restart.show{opacity:1;pointer-events:auto}
#restart:hover{background:#ff5a5a;color:#000}
#credit{position:fixed;right:36px;bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:6;font-size:10px;letter-spacing:.04em;color:rgba(255,255,255,.4);pointer-events:none;transition:opacity .4s}
#credit.hide{opacity:0}
#ctoggle{position:fixed;right:6px;bottom:calc(2px + env(safe-area-inset-bottom,0px));z-index:7;width:26px;height:26px;padding:0;font-size:13px;line-height:1;color:rgba(255,255,255,.22);background:transparent;border:0;cursor:pointer;transition:color .2s}
#ctoggle:hover,#ctoggle:active{color:rgba(255,255,255,.7)}
@media (max-width:600px){#restart{padding:10px 16px;font-size:14px}#credit{font-size:9px}}
</style></head><body>

<button id="restart" title="Volver a ver">&#8634; Reiniciar</button>
<script>
const LANGS=["Te amo","I love you","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Ik hou van jou","Jag älskar dig","Kocham cię","Seni seviyorum","Σ' αγαπώ","Я тебя люблю","愛してる","사랑해","我爱你","Aku cinta kamu","Anh yêu em","Mahal kita","Te iubesc","Szeretlek"];
const COLORS=["#ff4040","#ff5a4a","#e82e2e","#ff7060","#d62828","#ff3b3b"];
const box=document.getElementById("heart"),restart=document.getElementById("restart");
const TOTAL=13000; // ms que tarda en crearse todo el corazón
const ctx=document.createElement("canvas").getContext("2d");
// contorno del corazón (forma más marcada, punta abajo)
const POLY=[];
for(let i=0;i<240;i++){const t=i/240*Math.PI*2;
  POLY.push([16*Math.pow(Math.sin(t),3),(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*1.08]);}
function inside(x,y){let c=false;for(let i=0,j=POLY.length-1;i<POLY.length;j=i++){const [xi,yi]=POLY[i],[xj,yj]=POLY[j];
  if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function near(x,y){let m=1e9,k=0;for(let i=0;i<POLY.length;i++){const d=(POLY[i][0]-x)**2+(POLY[i][1]-y)**2;if(d<m){m=d;k=i}}return [Math.sqrt(m),(k-120+240)%240]} // indice 0 = punta inferior
let words=[];
function build(){
  box.innerHTML="";words=[];
  const S=box.clientWidth,rows=S<520?22:32,rh=S/rows,base=rh*0.7,k=32/(S*0.97);
  const toX=px=>(px-S/2)*k, toY=py=>-(py-S/2)*k-1.2;
  let bag=[];
  const next=()=>{if(!bag.length)bag=LANGS.slice().sort(()=>Math.random()-.5);return bag.pop()};
  const ringW=rh*k*1.0;
  for(let r=0;r<rows;r++){
    const cy=(r+.5)*rh,y=toY(cy),iv=[];let st=null;
    for(let px=0;px<=S;px+=2){
      const ins=inside(toX(px),y);
      if(ins&&st===null)st=px;
      if(!ins&&st!==null){iv.push([st,px]);st=null}
    }
    for(const [a0,b0] of iv){
      const a=a0+rh*.45,b=b0-rh*.45,W=b-a;
      if(W<45)continue;
      const items=[];let sum=0;
      for(let n=0;n<40;n++){
        const t=next(),fs=base*(.74+Math.random()*.28);
        ctx.font="600 "+fs+"px 'Segoe UI',Arial,sans-serif";
        const w=ctx.measureText(t).width;
        if(sum+w+items.length*6>W){bag.push(t);break}
        items.push({t,fs,w});sum+=w;
      }
      if(!items.length)continue;
      const gap=items.length>1?Math.min(26,(W-sum)/(items.length-1)):0;
      let x=a+(W-sum-gap*(items.length-1))/2;
      for(const it of items){
        const el=document.createElement("span");
        el.className="w";el.textContent=it.t;
        el.style.cssText=`left:${x}px;top:${cy-it.fs/2}px;font-size:${it.fs}px;color:${COLORS[Math.random()*COLORS.length|0]}`;
        box.appendChild(el);
        const wx=toX(x+it.w/2);
        const [dd,pos]=near(wx,y);
        words.push({el,ring:Math.floor(dd/(ringW*1.15)),ang:pos});
        x+=it.w+gap;
      }
    }
  }
  // anillo exterior primero: parte de la punta, da la vuelta y termina en la misma punta; luego anillos hacia adentro
  words.sort((p,q)=>p.ring-q.ring||(p.ring%2?q.ang-p.ang:p.ang-q.ang));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let prev=null;
function light(w){if(prev&&prev!==w)prev.el.classList.remove("glow");w.el.classList.add("glow");prev=w}
let run=0;
const credit=document.getElementById("credit"),ctoggle=document.getElementById("ctoggle");
ctoggle.onclick=()=>{const h=credit.classList.toggle("hide");ctoggle.innerHTML=h?"&#9432;":"&times;"};
function startMusic2(){
  aud2.currentTime=0;
  const p=aud2.play();
  if(p&&p.catch)p.catch(()=>{document.addEventListener("pointerdown",()=>aud2.play().catch(()=>{}),{once:true})});
}
async function play(){
  const id=++run;prev=null;ready=false;restart.classList.remove("show");box.style.visibility="visible";
  startMusic2();
  build();
  await new Promise(res=>{
    let shown=0;const t0=performance.now();
    (function tick(now){
      if(id!==run)return res();
      const target=Math.min(words.length,Math.floor((now-t0)/TOTAL*words.length)+1);
      while(shown<target){const w=words[shown++];w.el.classList.add("on");light(w)}
      shown<words.length?requestAnimationFrame(tick):res();
    })(t0);
  });
  if(id!==run)return;
  await sleep(300);
  restart.classList.add("show");ready=true;
  let last=-1;
  while(id===run){
    let i;do{i=Math.random()*words.length|0}while(i===last);
    last=i;light(words[i]);await sleep(750);
  }
}
let started=false,ready=false;
const aud2=document.getElementById("aud2"),aud=document.getElementById("aud"),intro=document.getElementById("intro"),ph=document.getElementById("ph"),tap=document.getElementById("tap");
const DUR=13,P=6000,FADE_IN=800,FADE_OUT=3000;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let introId=0;
async function runIntro(){
  const my=++introId;started=true;tap.style.display="none";
  const show=async(t)=>{ph.textContent=t;ph.style.transition="opacity .8s ease";ph.classList.remove("in");void ph.offsetWidth;ph.classList.add("in")};
  const t0=performance.now();
  await show("Claro que te amo...");
  await wait(P-FADE_IN);if(my!==introId)return;ph.classList.remove("in");await wait(FADE_IN);if(my!==introId)return;   // frase 1: 6 s
  await show("No me crees?...");
  await wait(P);if(my!==introId)return;                                                       // frase 2: 6 s en pantalla
  const left=Math.max(2,DUR*1000-(performance.now()-t0));            // resto del audio: desvanecido lento
  const FO=Math.min(FADE_OUT,left);
  await wait(left-FO);if(my!==introId)return;
  ph.style.transition="opacity "+FO+"ms linear";ph.classList.remove("in");
  await wait(FO);if(my!==introId)return;
  intro.classList.add("gone");
  play();
}
function begin(){aud.currentTime=0;const p=aud.play();
  if(p&&p.then)p.then(runIntro).catch(()=>{tap.style.display="block";intro.onclick=()=>{intro.onclick=null;aud.play().catch(()=>{});runIntro()}});
  else runIntro()}
begin();
function restartAll(){
  run++;introId++;ready=false;prev=null;
  restart.classList.remove("show");
  box.style.visibility="hidden";box.innerHTML="";words=[];
  intro.classList.remove("gone");ph.classList.remove("in");ph.textContent="";
  aud2.pause();aud2.currentTime=0;
  aud.pause();aud.currentTime=0;
  const p=aud.play();
  if(p&&p.catch)p.catch(()=>{});
  runIntro();
}
restart.onclick=restartAll;
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(ready&&words.every(w=>w.el.classList.contains("on"))){build();words.forEach(w=>w.el.classList.add("on"));prev=null}},250)});
</script></body></html>
